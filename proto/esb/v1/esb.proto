syntax = "proto3";

// Package esb.v1 is the wire between the esb CLI and the esb daemon.
//
// The daemon owns the route table and the Caddy config; the CLI only asks it
// for changes. That is why `esb up` needs no sudo and why there is no shared
// directory of config fragments for the two halves to disagree about.
package esb.v1;

option go_package = "github.com/hawkbawk/esb/internal/api/esbv1;esbv1";

// Route is one hostname reachable at https://<host>.<domain>, forwarding to a
// sandbox. A single sandbox can have many Routes (e.g. one per tenant in a
// multi-tenant app that switches on Host), which is why the sandbox label is
// carried on the route rather than being the route's key.
message Route {
  string host = 1;
  // sandbox is the sbx sandbox name this route forwards to.
  string sandbox = 2;
  // host_port is bound on 127.0.0.1 by the sandbox runtime. Routes that
  // share a (sandbox, sandbox_port) pair share a host_port too, so a
  // multi-tenant sandbox doesn't get the same container port published
  // more than once.
  uint32 host_port = 3;
  // sandbox_port is the port the app listens on inside the microVM.
  uint32 sandbox_port = 4;
}

message ListRoutesRequest {}

message ListRoutesResponse {
  repeated Route routes = 1;
}

// UpsertRouteRequest asks the daemon to route host to a sandbox. The daemon
// picks the host port, because only it knows which ports its other routes
// already hold.
message UpsertRouteRequest {
  string host = 1;
  string sandbox = 2;
  uint32 sandbox_port = 3;
}

message UpsertRouteResponse {
  Route route = 1;
}

message RemoveRouteRequest {
  string host = 1;
}

message RemoveRouteResponse {
  // route is the route that was removed, unset if the host had no route.
  Route route = 1;
}

// RemoveSandboxRoutesRequest drops every route for a sandbox at once, e.g.
// when the sandbox itself is being destroyed.
message RemoveSandboxRoutesRequest {
  string sandbox = 1;
}

message RemoveSandboxRoutesResponse {
  // routes are the routes that were removed.
  repeated Route routes = 1;
}

service RouteService {
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc UpsertRoute(UpsertRouteRequest) returns (UpsertRouteResponse);
  // RemoveRoute succeeds even when the host has no route: `esb down` should
  // still tear the sandbox down when only the route is already gone.
  rpc RemoveRoute(RemoveRouteRequest) returns (RemoveRouteResponse);
  rpc RemoveSandboxRoutes(RemoveSandboxRoutesRequest) returns (RemoveSandboxRoutesResponse);
}
