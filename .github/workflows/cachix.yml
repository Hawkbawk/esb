name: Cachix

# Deliberately push-only, main-only: pull_request runs (ci.yml) never get the
# write token, so a fork PR can't poison the cache or exfiltrate it. Only code
# that has already been reviewed and merged lands here.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-cache:
    # esb is darwin-only for now (see flake.nix's `systems` list), so only
    # aarch64-darwin is built and cached. Add x86_64-darwin here if/when a
    # GitHub-hosted Intel Mac runner is available and it's actually needed.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hawkbawk-esb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#esb -L
