name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix-build:
    # usher is darwin-only for now (see flake.nix), so validate on the same
    # platform the package actually targets.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hawkbawk-usher
      # doCheck is on for the usher package, and buildGoModule's default
      # checkPhase runs `go test ./...` (no subPackages set to narrow it), so
      # this also exercises the full test suite, including the
      # Caddyfile-render test and the vendorHash, catching a stale hash the
      # same way a real dependency bump would.
      - run: nix build .#usher -L
